skills:
  - slug: find-a-document
    title: Find a document
    summary: Search the connected document sources for a file and read what it says.
    instructions: >-
      Find the document the person is asking about before answering anything about its contents.
      Search first, then read the file you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the
      document might contain. Name the document you used.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - google-drive/get_file_metadata

  - slug: scout-tiktok-shop
    title: Scout TikTok Shop Stealth
    summary: Raspa produtos em alta e lojas no TikTok Shop ES/US usando o motor Stealth sem bloqueios.
    instructions: >-
      Pesquise produtos virais e concorrentes no TikTok Shop Espanha (ES) ou Estados Unidos (US).
      Utilize a ferramenta de busca stealth do Scrapling para extrair titulos, estimativas de vendas,
      precos e ganchos de dor/beneficio recomendados para a esteira Mercury-UGC.
    tools:
      - scrapling/scout_tiktok_shop_products

  - slug: script-ugc-15s
    title: 15s UGC Scriptwriting Framework
    summary: Cria roteiros de alta conversao de 15 segundos para produtos fisicos no TikTok Shop.
    instructions: >-
      Escreva um roteiro de 15 segundos seguindo os 3 atos obrigatorios:
      1. 0-3s: Gancho de impacto (dor ou curiosidade).
      2. 3-12s: Demonstracao visual do produto e quebra de objecao.
      3. 12-15s: CTA direto para o link/carrinho do TikTok Shop.
      Mantenha o limite maximo de 45 palavras em espanhol natural (Lucia Martinez) e mostre a contagem final.

  - slug: social-trend-scout
    title: Social Trend & Retention Scout
    summary: Mapeia tendencias e videos virais no Instagram/Facebook (LuxUndone) e YouTube Shorts (CrushCockpit).
    instructions: >-
      Pesquise e analise conteudos virais do nicho automotivo:
      - Para LuxUndone: Foque em ASMR, detalhes visuais e copys de engajamento no Instagram e Facebook.
      - Para CrushCockpit: Foque em loops de 7-8 segundos com alta retencao no YouTube Shorts.
      Extraia metricas publicas de engajamento sem depender de credenciais de login.
    tools:
      - social/scout_social_trends
